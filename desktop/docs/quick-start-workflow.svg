<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">MiniClip quick editing workflow</title>
  <desc id="desc">Four illustrated steps: import media, arrange clips, add text and audio, then export the finished video.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#303640"/><stop offset="1" stop-color="#252a32"/></linearGradient>
    <style>
      .ui{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}.h{font-size:19px;font-weight:700;fill:#f5f7fb}.t{font-size:14px;fill:#c6ceda}.m{font-size:12px;fill:#9da8b7}.n{font-size:17px;font-weight:700;fill:#fff;text-anchor:middle;dominant-baseline:middle}.clip{fill:#465b80;stroke:#7497d2}.btn{fill:#5b8cff}.line{stroke:#6d9bff;stroke-width:3;fill:none}
    </style>
  </defs>
  <rect width="1200" height="430" rx="18" fill="#171a20"/>
  <g class="ui">
    <text x="42" y="45" class="h">从素材到成片，只需沿着这四步完成</text>
    <text x="42" y="70" class="t">每一步都可以随时撤销；不确定最终效果时，先导出几秒短片确认。</text>

    <g transform="translate(38 100)">
      <rect width="255" height="278" rx="13" fill="url(#panel)" stroke="#4b5361"/>
      <circle cx="29" cy="30" r="16" class="btn"/><text x="29" y="31" class="n">1</text>
      <text x="55" y="36" class="h">导入媒体</text>
      <rect x="21" y="63" width="213" height="131" rx="8" fill="#171c24" stroke="#465160"/>
      <path d="M48 164 L92 112 L125 146 L155 96 L207 164Z" fill="#2f4d78"/>
      <circle cx="167" cy="106" r="12" fill="#ffd66b"/>
      <rect x="51" y="92" width="153" height="38" rx="8" class="btn"/>
      <text x="77" y="117" class="t" fill="#fff">＋ 导入媒体</text>
      <text x="21" y="222" class="t">一次可选多个视频或图片</text>
      <text x="21" y="247" class="m">导入后会自动出现在主视频轨</text>
    </g>

    <path d="M304 238 H342" class="line"/><path d="M342 238 l-11 -8 v16z" fill="#6d9bff"/>
    <g transform="translate(352 100)">
      <rect width="255" height="278" rx="13" fill="url(#panel)" stroke="#4b5361"/>
      <circle cx="29" cy="30" r="16" class="btn"/><text x="29" y="31" class="n">2</text>
      <text x="55" y="36" class="h">排顺序、裁剪镜头</text>
      <rect x="21" y="63" width="213" height="131" rx="8" fill="#171c24" stroke="#465160"/>
      <text x="31" y="88" class="m">视频轨</text>
      <rect x="31" y="101" width="74" height="53" rx="5" class="clip"/>
      <rect x="109" y="101" width="85" height="53" rx="5" class="clip"/>
      <rect x="198" y="101" width="25" height="53" rx="5" class="clip"/>
      <line x1="105" y1="96" x2="105" y2="160" stroke="#fff" stroke-width="3"/>
      <line x1="194" y1="96" x2="194" y2="160" stroke="#fff" stroke-width="3"/>
      <line x1="151" y1="82" x2="151" y2="175" stroke="#ff6262" stroke-width="2"/>
      <path d="M145 83H157L151 91Z" fill="#ff6262"/>
      <text x="21" y="222" class="t">拖动排序，拖左右边缘裁剪</text>
      <text x="21" y="247" class="m">Ctrl/⌘+B 可在播放头处分割</text>
    </g>

    <path d="M618 238 H656" class="line"/><path d="M656 238 l-11 -8 v16z" fill="#6d9bff"/>
    <g transform="translate(666 100)">
      <rect width="255" height="278" rx="13" fill="url(#panel)" stroke="#4b5361"/>
      <circle cx="29" cy="30" r="16" class="btn"/><text x="29" y="31" class="n">3</text>
      <text x="55" y="36" class="h">添加画面和声音</text>
      <rect x="21" y="63" width="213" height="131" rx="8" fill="#121821" stroke="#465160"/>
      <rect x="37" y="80" width="181" height="98" rx="5" fill="#2b486f"/>
      <rect x="48" y="91" width="88" height="22" rx="4" fill="#ffffff" opacity=".94"/>
      <text x="56" y="107" class="m" fill="#202634">标题 / 字幕</text>
      <rect x="166" y="118" width="40" height="45" rx="5" fill="#f1ba65" stroke="#ffe1a3"/>
      <path d="M37 184 H218" stroke="#5a8f91" stroke-width="4"/>
      <path d="M45 184 l8 -9 l8 17 l8 -13 l8 6 l8 -15 l8 20 l8 -8 l8 5 l8 -13 l8 14 l8 -8 l8 9" fill="none" stroke="#b8f0ed" stroke-width="2"/>
      <text x="21" y="222" class="t">文字、贴纸、B-roll、音乐</text>
      <text x="21" y="247" class="m">先看普通预览，再看成片预览</text>
    </g>

    <path d="M932 238 H970" class="line"/><path d="M970 238 l-11 -8 v16z" fill="#6d9bff"/>
    <g transform="translate(980 100)">
      <rect width="182" height="278" rx="13" fill="url(#panel)" stroke="#4b5361"/>
      <circle cx="29" cy="30" r="16" class="btn"/><text x="29" y="31" class="n">4</text>
      <text x="55" y="36" class="h">导出 MP4</text>
      <rect x="27" y="72" width="128" height="142" rx="9" fill="#131820" stroke="#465160"/>
      <rect x="40" y="87" width="102" height="70" rx="4" fill="#34557d"/>
      <path d="M83 171 h30 l-7 12 h-16z" fill="#dce6f4"/>
      <rect x="43" y="184" width="96" height="17" rx="8" class="btn"/>
      <text x="67" y="197" class="m" fill="#fff">⤴ 导出</text>
      <text x="22" y="239" class="t">选择质量和保存位置</text>
      <text x="22" y="262" class="m">最终效果以 MP4 为准</text>
    </g>
  </g>
</svg>
