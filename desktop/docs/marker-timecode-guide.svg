<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">MiniClip markers and precise time navigation</title>
  <desc id="desc">Three illustrated panels showing adding a marker, entering a timecode, and navigating between markers and edit points.</desc>
  <defs><style>.ui{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}.h{font-size:19px;font-weight:700;fill:#f5f7fb}.t{font-size:14px;fill:#c8d0db}.m{font-size:12px;fill:#9ca8b7}.n{font-size:16px;font-weight:700;fill:#fff;text-anchor:middle;dominant-baseline:middle}.num{fill:#5b8cff}</style></defs>
  <rect width="1200" height="360" rx="18" fill="#171a20"/>
  <g class="ui">
    <text x="39" y="44" class="h">用标记、时间码和剪辑点快速回到准确位置</text>
    <g transform="translate(38 78)">
      <rect width="350" height="235" rx="12" fill="#2a2f38" stroke="#4b5361"/>
      <circle cx="30" cy="31" r="16" class="num"/><text x="30" y="32" class="n">1</text><text x="57" y="37" class="h">在播放头添加标记</text>
      <rect x="24" y="61" width="302" height="32" rx="6" fill="#343a45"/><rect x="34" y="67" width="72" height="20" rx="4" fill="#294a53" stroke="#79e0ed"/><text x="44" y="82" class="m" fill="#fff">🧲 磁吸</text><rect x="115" y="67" width="62" height="20" rx="4" fill="#454d5b"/><text x="126" y="82" class="m">◆ 标记</text><rect x="184" y="67" width="126" height="20" rx="4" fill="#454d5b"/><text x="193" y="82" class="m">开场 · 注释</text>
      <line x1="38" y1="130" x2="312" y2="130" stroke="#596270"/><rect x="38" y="145" width="124" height="42" rx="5" fill="#465b80"/><rect x="166" y="145" width="146" height="42" rx="5" fill="#465b80"/>
      <line x1="175" y1="111" x2="175" y2="202" stroke="#ff6262" stroke-width="2"/><path d="M168 111H182L175 119Z" fill="#ff6262"/><path d="M174 110 l8 -8 l8 8 l-8 8z" fill="#ffd15c"/>
      <text x="24" y="216" class="t">按 M，填写“开场 / 待替换 / 卡点”等注释</text>
    </g>
    <g transform="translate(425 78)">
      <rect width="350" height="235" rx="12" fill="#2a2f38" stroke="#4b5361"/>
      <circle cx="30" cy="31" r="16" class="num"/><text x="30" y="32" class="n">2</text><text x="57" y="37" class="h">输入时间码直接跳转</text>
      <rect x="25" y="69" width="300" height="36" rx="7" fill="#171c24" stroke="#627084"/><text x="39" y="92" class="t">1:02.5</text><text x="235" y="92" class="m">Enter ↵</text>
      <path d="M174 122 V178" stroke="#6d9bff" stroke-width="3"/><path d="M166 169 l8 10 l8 -10z" fill="#6d9bff"/>
      <line x1="39" y1="203" x2="311" y2="203" stroke="#596270"/><text x="39" y="194" class="m">0:00</text><text x="272" y="194" class="m">1:10</text><line x1="196" y1="184" x2="196" y2="218" stroke="#ff6262" stroke-width="2"/>
      <text x="25" y="222" class="t">支持 12.5、1:02.5、1:01:02.5</text>
    </g>
    <g transform="translate(812 78)">
      <rect width="350" height="235" rx="12" fill="#2a2f38" stroke="#4b5361"/>
      <circle cx="30" cy="31" r="16" class="num"/><text x="30" y="32" class="n">3</text><text x="57" y="37" class="h">键盘在剪辑点间移动</text>
      <rect x="28" y="70" width="84" height="32" rx="7" fill="#3d4655"/><text x="50" y="91" class="t">[</text><text x="76" y="91" class="m">上一标记</text>
      <rect x="122" y="70" width="84" height="32" rx="7" fill="#3d4655"/><text x="143" y="91" class="t">]</text><text x="166" y="91" class="m">下一标记</text>
      <rect x="216" y="70" width="106" height="32" rx="7" fill="#3d4655"/><text x="227" y="91" class="m">PgUp / PgDn</text>
      <line x1="34" y1="160" x2="315" y2="160" stroke="#596270"/><g fill="#465b80" stroke="#7797cc"><rect x="36" y="174" width="74" height="38" rx="5"/><rect x="114" y="174" width="92" height="38" rx="5"/><rect x="210" y="174" width="101" height="38" rx="5"/></g><line x1="111" y1="145" x2="111" y2="218" stroke="#ff6262" stroke-width="2"/>
      <text x="28" y="237" class="t">PgUp/PgDn 跳前后剪辑点；←/→ 逐帧微调</text>
    </g>
  </g>
</svg>
