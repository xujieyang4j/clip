name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Select iOS Simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          destination=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin)["devices"]; devices=[d for runtime in data.values() for d in runtime if d.get("isAvailable") and (d.get("name", "").startswith("iPhone"))]; print("platform=iOS Simulator,id=" + devices[0]["udid"] if devices else "")')
          test -n "$destination"
          echo "destination=$destination" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project MiniClip.xcodeproj \
            -scheme MiniClip \
            -destination '${{ steps.simulator.outputs.destination }}' \
            CODE_SIGNING_ALLOWED=NO

      - name: Build release configuration
        run: |
          set -o pipefail
          xcodebuild build \
            -project MiniClip.xcodeproj \
            -scheme MiniClip \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
