# XcodeGen 工程描述文件。
# 在 Mac 上执行 `xcodegen generate` 会根据这里的配置生成 MiniClip.xcodeproj，
# 自动包含 Sources/ 下的 Swift 文件、iOS 目标以及所有必需的权限设置。
#
# 好处：不用在 Xcode 里手动新建工程、手动拖文件、手动点权限——全部由这份文件描述。
# 每次改了这份文件或增删源文件，重新跑一次 `xcodegen generate` 即可。

name: MiniClip

options:
  bundleIdPrefix: com.example
  # 代码用到 PhotosPicker / ShareLink / draggable / async 加载，所以至少 iOS 16。
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"

targets:
  MiniClip:
    type: application
    supportedDestinations: [iOS]
    sources:
      - path: Sources
        excludes:
          - MiniClip-macOS.entitlements
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.MiniClip
        PRODUCT_NAME: MiniClip
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 自动生成 Info.plist，权限文案直接写成下面的 INFOPLIST_KEY_* 即可，
        # 省得单独维护一个 Info.plist 文件。
        GENERATE_INFOPLIST_FILE: YES

        # —— iOS 权限 / 外观 ——
        # 从「文件」App 导入视频其实走的是文档选择器，不强制要相册权限；
        # 但保留这条文案，方便你以后改用相册选择器（PhotosPicker）时不用再配。
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "需要访问相册来导入视频和图片"
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "需要将导出的成片保存到系统相册"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "需要使用麦克风录制视频旁白"
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "需要使用系统语音识别将视频原声转换为可编辑字幕"
        # 生成默认启动屏，App 才会以全分辨率运行。
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"

        # 自动签名。装到真机时，在 Xcode 里 Signing & Capabilities 选你的 Apple ID Team 即可。
        CODE_SIGN_STYLE: Automatic

  MiniClipTests:
    type: bundle.unit-test
    supportedDestinations: [iOS]
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Tests
    dependencies:
      - target: MiniClip
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.MiniClipTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  MiniClip:
    build:
      targets:
        MiniClip: all
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - MiniClipTests
    run:
      config: Debug
    archive:
      config: Release
